[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-azure-app"
version = "0.1.0"
description = "FastAPI application deployed to Azure App Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
]

[tool.pytest.ini_options]
pythonpath = ["."]