[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratsync-risk-bot"
version = "0.1.0"
description = "Microsoft Teams Risk Notification Bot"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "aiohttp",
]

[tool.setuptools]
py-modules = ["main"]